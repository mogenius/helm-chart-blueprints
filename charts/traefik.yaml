apiVersion: v1
kind: HelmBlueprint
metadata:
  id: traefik
  displayName: Traefik
  description: Cloud-native reverse proxy and ingress controller with automatic HTTPS via Let's Encrypt
  category: networking
  icon: https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png
  tags: [ingress, proxy, networking, loadbalancer]
spec:
  repository:
    name: traefik
    url: https://helm.traefik.io/traefik
  chart:
    name: traefik/traefik
    version: "41.0.2"
  install:
    release: traefik
    namespace: traefik
  values: |
    deployment:
      replicas: 1
    service:
      spec:
        type: LoadBalancer

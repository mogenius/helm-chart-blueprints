apiVersion: v1
kind: HelmBlueprint
metadata:
  id: mogenius-integration-cnpg
  displayName: mogenius CloudNativePG Integration
  description: Connects mogenius with CloudNativePG to surface Postgres cluster state in the mogenius UI
  category: ui-components
  icon: https://avatars.githubusercontent.com/u/92862356
  tags: [mogenius, cnpg, postgres, database, integration]
spec:
  repository:
    name: mogenius-oci
    url: oci://ghcr.io/mogenius/helm-charts
  chart:
    name: mogenius-oci/mogenius-integration-cnpg
    version: "0.2.0"
  install:
    release: mogenius-integration-cnpg
    namespace: mogenius
  values: ""

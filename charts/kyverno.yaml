apiVersion: v1
kind: HelmBlueprint
metadata:
  id: kyverno
  displayName: Kyverno
  description: Kubernetes-native policy engine — validates, mutates and generates resources using admission webhooks
  category: security
  icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/kyverno/icon/color/kyverno-icon-color.svg
  tags: [policy, security, admission-control, compliance]
spec:
  repository:
    name: kyverno
    url: https://kyverno.github.io/kyverno
  chart:
    name: kyverno/kyverno
    version: "3.8.2"
  install:
    release: kyverno
    namespace: kyverno
  values: |
    admissionController:
      replicas: 1
